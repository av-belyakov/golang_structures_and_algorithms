version: "3.8"

services:
  # Шард 1, Реплика 1
  clickhouse-01:
    # alpine-версия для минимизации размера образа
    image: "clickhouse/clickhouse-server:latest-alpine"
    container_name: clickhouse-01
    hostname: clickhouse-01
    restart: unless-stopped
    networks:
      # общая сеть для clickhouse и clickhouse-keeper
      - clickhouse-network
    ports:
      # HTTP интерфейс (для ClickHouse Client и HTTP API)
      - "8123:8123"
      # нативный протокол (для обмена данными между серверами)
      - "9000:9000"
      # межсерверный порт (для репликации)
      - "9009:9009"
    volumes:
      - ./clickhouse-01-data:/var/lib/clickhouse/:rw
      - ./clickhouse-01-log:/var/log/clickhouse-server/:rw
      #
      # при загрузке сервер clickhouse мерджит default конфигурационные файлы которые уже есть в папке сервера
      # с файлами подключаемыми пользователем
      #
      # подключение к Keeper, настройки загружаются первыми
      - ./clickhouse-configs/zookeeper.xml:/etc/clickhouse-server/config.d/00-zookeeper.xml:ro
      # макросы для репликации, должны быть загружены вторыми
      - ./clickhouse-configs/macros-01.xml:/etc/clickhouse-server/config.d/10-macros.xml:ro
      # настройки кластера, загружаются сразу после макросов
      - ./clickhouse-configs/cluster.xml:/etc/clickhouse-server/config.d/20-cluster.xml
      # настройки сервера
      - ./clickhouse-configs/config.xml:/etc/clickhouse-server/config.d/30-config.xml:rw
      - ./clickhouse-configs/ipv4.xml:/etc/clickhouse-server/config.d/ipv4.xml:ro
      # для упрощения, для всех элементов кластера используем одни и теже настройки пользователя
      - ./clickhouse-configs/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      # временную зону не надо пробрасывать так как настройка часового пояса выполняется в config.xml
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # ulimits критически важна для production-нагрузок
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Шард 1, Реплика 2
  clickhouse-02:
    image: "clickhouse/clickhouse-server:latest-alpine"
    container_name: clickhouse-02
    hostname: clickhouse-02
    restart: unless-stopped
    networks:
      - clickhouse-network
    ports:
      - "8124:8123"
      - "9001:9000"
      - "9010:9009"
    volumes:
      - ./clickhouse-02-data:/var/lib/clickhouse/:rw
      - ./clickhouse-02-log:/var/log/clickhouse-server/:rw
      - ./clickhouse-configs/zookeeper.xml:/etc/clickhouse-server/config.d/00-zookeeper.xml:ro
      - ./clickhouse-configs/macros-02.xml:/etc/clickhouse-server/config.d/10-macros.xml:ro
      - ./clickhouse-configs/cluster.xml:/etc/clickhouse-server/config.d/20-cluster.xml
      - ./clickhouse-configs/config.xml:/etc/clickhouse-server/config.d/30-custom-config.xml:rw
      - ./clickhouse-configs/ipv4.xml:/etc/clickhouse-server/config.d/ipv4.xml:ro
      - ./clickhouse-configs/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Шард 2, Реплика 1
  clickhouse-03:
    image: "clickhouse/clickhouse-server:latest-alpine"
    container_name: clickhouse-03
    hostname: clickhouse-03
    restart: unless-stopped
    networks:
      - clickhouse-network
    ports:
      - "8125:8123"
      - "9002:9000"
      - "9011:9009"
    volumes:
      - ./clickhouse-03-data:/var/lib/clickhouse/:rw
      - ./clickhouse-03-log:/var/log/clickhouse-server/:rw
      - ./clickhouse-configs/zookeeper.xml:/etc/clickhouse-server/config.d/00-zookeeper.xml:ro
      - ./clickhouse-configs/macros-03.xml:/etc/clickhouse-server/config.d/10-macros.xml:ro
      - ./clickhouse-configs/cluster.xml:/etc/clickhouse-server/config.d/20-cluster.xml
      - ./clickhouse-configs/config.xml:/etc/clickhouse-server/config.d/30-custom-config.xml:rw
      - ./clickhouse-configs/ipv4.xml:/etc/clickhouse-server/config.d/ipv4.xml:ro
      - ./clickhouse-configs/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Шард 2, Реплика 2
  clickhouse-04:
    image: "clickhouse/clickhouse-server:latest-alpine"
    container_name: clickhouse-04
    hostname: clickhouse-04
    restart: unless-stopped
    networks:
      - clickhouse-network
    ports:
      - "8126:8123"
      - "9003:9000"
      - "9012:9009"
    volumes:
      - ./clickhouse-configs/zookeeper.xml:/etc/clickhouse-server/config.d/00-zookeeper.xml:ro
      - ./clickhouse-configs/macros-04.xml:/etc/clickhouse-server/config.d/10-macros.xml:ro
      - ./clickhouse-configs/cluster.xml:/etc/clickhouse-server/config.d/20-cluster.xml
      - ./clickhouse-configs/config.xml:/etc/clickhouse-server/config.d/30-config.xml:rw
      - ./clickhouse-configs/ipv4.xml:/etc/clickhouse-server/config.d/ipv4.xml:ro
      - ./clickhouse-configs/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./clickhouse-04-data:/var/lib/clickhouse/:rw
      - ./clickhouse-04-log:/var/log/clickhouse-server/:rw
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

#volumes:
#  clickhouse-01-data:
#  clickhouse-02-data:
#  clickhouse-03-data:
#  clickhouse-04-data:

networks:
  clickhouse-network:
    # 'external', если сеть уже создана вашим Keeper-кластером
    external: true
