version: "3.8"

services:
  clickhouse-server:
    # alpine-версия для минимизации размера образа
    image: "clickhouse/clickhouse-server:latest-alpine"
    container_name: clickhouse-server
    hostname: clickhouse-server
    restart: unless-stopped
    networks:
      # общая сеть для clickhouse и clickhouse-keeper
      - clickhouse-network
    ports:
      # HTTP интерфейс (для ClickHouse Client и HTTP API)
      - "8123:8123"
      # нативный протокол (для обмена данными между серверами)
      - "9000:9000"
      # межсерверный порт (для репликации)
      - "9009:9009"
    volumes:
      # конфигурация, определяющая подключение к Keeper
      - ./configs/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
      - ./configs/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./configs/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - clickhouse-data:/var/lib/clickhouse
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # ulimits критически важна для production-нагрузок
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-data:
    driver: local

networks:
  clickhouse-network:
    # 'external', если сеть уже создана вашим Keeper-кластером
    external: true
