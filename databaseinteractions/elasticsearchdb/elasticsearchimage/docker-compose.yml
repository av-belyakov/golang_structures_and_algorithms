services:
  elasticsearch_old:
    image: my-elasticsearch:with-minio-cert
    container_name: elasticsearch_source
    environment:
      - node.name=elasticsearch
      - cluster.name=es-docker-cluster
      - discovery.type=single-node # если в кластере один узел
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      # сертификаты нужны для защиты взаимодействия между узлами кластера
      # подробнее https://www.elastic.co/docs/deploy-manage/security/set-up-basic-security
      #      - xpack.security.transport.ssl.enabled=true
      #      - xpack.security.transport.ssl.verification_mode=certificate
      #      - xpack.security.transport.ssl.keystore.path=certs/elastic-certificates.p12
      #      - xpack.security.transport.ssl.truststore.path=certs/elastic-certificates.p12
      # всё что ниже это настройки для elasticvue web
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8484
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
      - http.cors.allow-credentials=true
    volumes:
      - es_data:/usr/share/elasticsearch/data
    #  - ./minio/certs/public.crt:/usr/share/elasticsearch/config/minio-cert.pem:ro
    #      - ./entrypoint.sh:/usr/share/elasticsearch/config/entrypoint.sh:ro
    #      - ./certs:/usr/share/elasticsearch/config/certs
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    networks:
      - elastic-network

  elasticsearch_new:
    image: my-elasticsearch:with-minio-cert
    container_name: elasticsearch_recipient
    environment:
      - node.name=elasticsearch
      - cluster.name=es-docker-cluster
      - discovery.type=single-node # если в кластере один узел
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      # сертификаты нужны для защиты взаимодействия между узлами кластера
      # подробнее https://www.elastic.co/docs/deploy-manage/security/set-up-basic-security
      #      - xpack.security.transport.ssl.enabled=true
      #      - xpack.security.transport.ssl.verification_mode=certificate
      #      - xpack.security.transport.ssl.keystore.path=certs/elastic-certificates.p12
      #      - xpack.security.transport.ssl.truststore.path=certs/elastic-certificates.p12
      # всё что ниже это настройки для elasticvue web
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8484
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
      - http.cors.allow-credentials=true
    #entrypoint: ["/usr/share/elasticsearch/config/entrypoint.sh"]
    volumes:
      - es_new_data:/usr/share/elasticsearch/data
    #  - ./minio/certs/public.crt:/usr/share/elasticsearch/config/minio-cert.pem:ro
    #  - ./entrypoint.sh:/usr/share/elasticsearch/config/entrypoint.sh:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9211:9200"
    networks:
      - elastic-network

  # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  # Здесь, для теста успешности миграции данных с одного elasticsearch на другой elasticsearch нужно развернуть
  # второй elasticsearch который будет служить получателем данных

  kibana_es_old:
    image: docker.elastic.co/kibana/kibana:9.3.0
    #image: docker.elastic.co/kibana/kibana:8.15.0
    #image: docker.elastic.co/kibana/kibana:7.14.1
    container_name: kibana_es_source
    depends_on:
      - elasticsearch_old
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch_old:9200
      - ELASTICSEARCH_USERNAME=${KIBANA_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ES_OLD_PASSWORD}
      - XPACK_MONITORING_ENABLED=true
      - XPACK_XPACK_MAIN_ENABLED=true
    volumes:
      - ./kibana/config/kibana_old.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - elastic-network

  kibana_es_new:
    image: docker.elastic.co/kibana/kibana:9.3.0
    #kibana:7.17.28
    container_name: kibana_es_recipient
    depends_on:
      - elasticsearch_new
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch_new:9200
      - ELASTICSEARCH_USERNAME=${KIBANA_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ES_NEW_PASSWORD}
      - XPACK_MONITORING_ENABLED=true
      - XPACK_XPACK_MAIN_ENABLED=true
      - SERVER_NAME=kibana_new
      - SERVER_HOST=0.0.0.0
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - MONITORING_UI_CONTAINER_ELASTICSEARCH_ENABLED=true
      - XPACK_MONITORING_UI_CONTAINER_ELASTICSEARCH_ENABLED=true
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5611:5601"
    networks:
      - elastic-network

  elasticvue:
    image: cars10/elasticvue:latest
    container_name: elasticvue
    ports:
      - "8484:8080"
    environment:
      - PORT=8080
    volumes:
      - ./elasticvue/config/clusters.json:/usr/share/nginx/html/api/default_clusters.json:rw
    depends_on:
      - elasticsearch_old
    networks:
      - elastic-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9900:9000"
      - "9901:9001"
    command: 'minio server $HOME/shared --console-address ":9001"'
    environment:
      #      - MINIO_CONFIG_ENV_FILE=$HOME/minio/config/app.conf
      - MINIO_ROOT_USER=${MINIO_ROOTUSER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOTPASSWD:-Gt9-Hb7-As1-Nm5}
      - MINIO_SERVER_URL=https://minio:9000
      - MINIO_BROWSER_REDIRECT_URL=https://minio:9001
    volumes:
      - $PWD/minio/data:$HOME/shared:rw
      - $PWD/minio/certs:/root/.minio/certs:ro
      # выполняем для корректного отображения даты с учетом временной зоны
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - elastic-network
    restart: unless-stopped

volumes:
  es_data:
  es_new_data:

networks:
  elastic-network:
    driver: bridge
